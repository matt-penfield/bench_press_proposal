<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bench Press — Proposal Similarity Matcher</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f8f9fb;
      color: #1a1a2e;
      line-height: 1.6;
      min-height: 100vh;
    }

    header {
      background: #fff;
      border-bottom: 1px solid #e8eaed;
      padding: 20px 0;
    }

    header .inner {
      max-width: 860px;
      margin: 0 auto;
      padding: 0 24px;
    }

    header h1 {
      font-size: 22px;
      font-weight: 700;
      color: #1a1a2e;
      letter-spacing: -0.3px;
    }

    header h1 span {
      color: #5e6ad2;
    }

    header p {
      font-size: 14px;
      color: #6b7280;
      margin-top: 2px;
    }

    main {
      max-width: 860px;
      margin: 0 auto;
      padding: 32px 24px;
    }

    /* Input section */
    .input-section {
      background: #fff;
      border: 1px solid #e8eaed;
      border-radius: 12px;
      padding: 28px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #374151;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    label .hint {
      font-weight: 400;
      text-transform: none;
      letter-spacing: 0;
      color: #9ca3af;
      margin-left: 4px;
    }

    textarea {
      width: 100%;
      border: 1.5px solid #e5e7eb;
      border-radius: 8px;
      padding: 12px 14px;
      font-family: inherit;
      font-size: 15px;
      color: #1a1a2e;
      background: #fafbfc;
      resize: vertical;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    textarea:focus {
      outline: none;
      border-color: #5e6ad2;
      box-shadow: 0 0 0 3px rgba(94, 106, 210, 0.1);
      background: #fff;
    }

    textarea::placeholder { color: #c4c9d4; }

    .field + .field { margin-top: 20px; }

    button#search-btn {
      margin-top: 24px;
      width: 100%;
      padding: 13px 24px;
      background: #5e6ad2;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    button#search-btn:hover { background: #4f5bc0; }
    button#search-btn:active { background: #4550b0; }

    button#search-btn:disabled {
      background: #c4c9d4;
      cursor: not-allowed;
    }

    /* Results */
    .results-section {
      margin-top: 32px;
    }

    .results-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .results-header h2 {
      font-size: 16px;
      font-weight: 600;
      color: #374151;
    }

    .results-header .count {
      font-size: 13px;
      color: #9ca3af;
    }

    .keywords-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 16px;
    }

    .keyword-tag {
      font-size: 12px;
      padding: 3px 10px;
      background: #eef0fb;
      color: #5e6ad2;
      border-radius: 100px;
      font-weight: 500;
    }

    .result-card {
      background: #fff;
      border: 1px solid #e8eaed;
      border-radius: 10px;
      padding: 22px 24px;
      margin-bottom: 12px;
      transition: box-shadow 0.15s;
    }

    .result-card:hover {
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }

    .result-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
    }

    .result-title {
      font-size: 16px;
      font-weight: 600;
      color: #1a1a2e;
    }

    .result-source {
      font-size: 12px;
      color: #9ca3af;
      margin-top: 2px;
    }

    .score-badge {
      flex-shrink: 0;
      min-width: 52px;
      text-align: center;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 18px;
      font-weight: 700;
    }

    .score-high   { background: #ecfdf5; color: #059669; }
    .score-medium { background: #fef9ee; color: #d97706; }
    .score-low    { background: #fef2f2; color: #dc2626; }

    .result-excerpt {
      margin-top: 14px;
      font-size: 14px;
      color: #4b5563;
      line-height: 1.7;
      border-left: 3px solid #e8eaed;
      padding-left: 14px;
    }

    .result-excerpt mark {
      background: #fef08a;
      color: inherit;
      border-radius: 2px;
      padding: 0 2px;
    }

    /* Empty / no results */
    .empty-state {
      text-align: center;
      padding: 48px 24px;
      color: #9ca3af;
    }

    .empty-state .icon {
      font-size: 40px;
      margin-bottom: 12px;
    }

    .empty-state p {
      font-size: 15px;
    }

    .no-results {
      text-align: center;
      padding: 40px 24px;
      color: #9ca3af;
      font-size: 15px;
    }

    /* Model status */
    .model-status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      font-size: 13px;
      color: #9ca3af;
    }

    .model-status.ready { color: #059669; }
    .model-status.error { color: #dc2626; }

    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid #e5e7eb;
      border-top-color: #5e6ad2;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    .model-status.ready .spinner,
    .model-status.error .spinner { display: none; }

    @keyframes spin { to { transform: rotate(360deg); } }

    .progress-bar {
      width: 200px;
      height: 4px;
      background: #e5e7eb;
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-bar .fill {
      height: 100%;
      background: #5e6ad2;
      border-radius: 2px;
      transition: width 0.3s;
    }

    .searching-msg {
      text-align: center;
      padding: 48px 24px;
      color: #6b7280;
      font-size: 15px;
    }

    .searching-msg .spinner {
      width: 20px;
      height: 20px;
      margin: 0 auto 12px;
    }

    .loading-dots {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-bottom: 16px;
    }

    .loading-dots span {
      display: inline-block;
      width: 10px;
      height: 10px;
      background: #5e6ad2;
      border-radius: 50%;
      animation: bounce 1.2s ease-in-out infinite;
    }

    .loading-dots span:nth-child(2) { animation-delay: 0.15s; }
    .loading-dots span:nth-child(3) { animation-delay: 0.3s; }
    .loading-dots span:nth-child(4) { animation-delay: 0.45s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-10px); opacity: 1; }
    }

    /* Selection */
    .result-card {
      cursor: pointer;
      position: relative;
    }

    .result-card.selected {
      border-color: #5e6ad2;
      box-shadow: 0 0 0 2px rgba(94, 106, 210, 0.15);
      background: #fafaff;
    }

    .select-check {
      position: absolute;
      top: 14px;
      left: 14px;
      width: 22px;
      height: 22px;
      border-radius: 6px;
      border: 2px solid #d1d5db;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }

    .result-card.selected .select-check {
      border-color: #5e6ad2;
      background: #5e6ad2;
    }

    .select-check svg {
      width: 14px;
      height: 14px;
      opacity: 0;
      transition: opacity 0.15s;
    }

    .result-card.selected .select-check svg {
      opacity: 1;
    }

    .result-card .result-top {
      padding-left: 32px;
    }

    .selection-hint {
      font-size: 15px;
      font-weight: 600;
      color: #1a1a2e;
      background: #eef0fb;
      border: 1px solid #d9ddf7;
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 16px;
    }

    .selection-hint strong {
      color: #5e6ad2;
    }

    /* Draft button */
    #draft-btn {
      margin-top: 20px;
      width: 100%;
      padding: 14px 24px;
      background: #059669;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
    }

    #draft-btn:hover { background: #047857; }
    #draft-btn:active { background: #065f46; }
    #draft-btn:disabled { background: #c4c9d4; cursor: not-allowed; }

    /* Draft output */
    .draft-section {
      margin-top: 32px;
    }

    .draft-section h2 {
      font-size: 18px;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 16px;
    }

    .draft-output {
      background: #fff;
      border: 1px solid #e8eaed;
      border-radius: 12px;
      padding: 28px;
    }

    .draft-output h3 {
      font-size: 14px;
      font-weight: 600;
      color: #5e6ad2;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 24px;
      margin-bottom: 8px;
    }

    .draft-output h3:first-child { margin-top: 0; }

    .draft-output p {
      font-size: 15px;
      color: #374151;
      line-height: 1.8;
      margin-bottom: 8px;
    }

    .draft-output ul {
      padding-left: 20px;
      margin-bottom: 8px;
    }

    .draft-output li {
      font-size: 14px;
      color: #4b5563;
      line-height: 1.7;
      margin-bottom: 4px;
    }

    .draft-output .ref-tag {
      display: inline-block;
      font-size: 12px;
      padding: 2px 8px;
      background: #eef0fb;
      color: #5e6ad2;
      border-radius: 4px;
      margin-right: 6px;
      margin-bottom: 4px;
    }

    /* Score explanation */
    .score-why {
      margin-top: 12px;
      padding: 12px 14px;
      background: #f8f9fb;
      border-radius: 8px;
      border: 1px solid #eef0fb;
    }

    .score-why-header {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #9ca3af;
      margin-bottom: 6px;
    }

    .score-why-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-size: 13px;
      color: #4b5563;
      line-height: 1.5;
      margin-bottom: 4px;
    }

    .score-why-item:last-child { margin-bottom: 0; }

    .score-why-sim {
      flex-shrink: 0;
      font-size: 11px;
      font-weight: 600;
      padding: 1px 6px;
      border-radius: 4px;
      background: #eef0fb;
      color: #5e6ad2;
      margin-top: 1px;
    }

    /* File upload */
    .file-upload-area {
      margin-top: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .file-upload-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      background: #f3f4f6;
      border: 1.5px dashed #d1d5db;
      border-radius: 6px;
      font-family: inherit;
      font-size: 13px;
      color: #6b7280;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }

    .file-upload-btn:hover {
      border-color: #5e6ad2;
      background: #eef0fb;
      color: #5e6ad2;
    }

    .file-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .file-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      background: #eef0fb;
      color: #5e6ad2;
      font-size: 12px;
      font-weight: 500;
      border-radius: 100px;
    }

    .file-chip button {
      background: none;
      border: none;
      color: #5e6ad2;
      font-size: 14px;
      cursor: pointer;
      padding: 0;
      line-height: 1;
      opacity: 0.6;
    }

    .file-chip button:hover { opacity: 1; }
  </style>
</head>
<body>
  <header>
    <div class="inner">
      <h1><span>Proposal Accelerator</span></h1>
      <p>Find similar past proposals and use them to guide the development of new ones</p>
      <div class="model-status" id="model-status">
        <div class="spinner"></div>
        <span id="status-text">Initializing…</span>
        <div class="progress-bar" id="progress-bar" style="display:none"><div class="fill" id="progress-fill"></div></div>
      </div>
    </div>
  </header>

  <main>
    <div class="input-section">
      <div class="field">
        <label for="problem">Problem Statement</label>
        <textarea id="problem" rows="4" placeholder="Describe the client's core challenge or ask…"></textarea>
      </div>
      <div class="field">
        <label for="supplemental">Supplemental Info <span class="hint">— industry, constraints, technologies, timeline, etc.</span></label>
        <textarea id="supplemental" rows="3" placeholder="Any additional context that might help find similar work…"></textarea>
        <div class="file-upload-area">
          <label class="file-upload-btn">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 1v9M4 4l3-3 3 3"/><path d="M1 9v3a1 1 0 001 1h10a1 1 0 001-1V9"/></svg>
            Upload files
            <input type="file" id="file-input" multiple accept=".txt,.md,.pdf,.doc,.docx,.rtf,.csv,.json" hidden>
          </label>
          <div class="file-chips" id="file-chips"></div>
        </div>
      </div>
      <button id="search-btn">Find Similar Proposals</button>
    </div>

    <div class="results-section" id="results-section" style="display:none;">
      <div class="results-header">
        <h2>Results</h2>
        <span class="count" id="results-count"></span>
      </div>
      <div class="selection-hint" id="selection-hint" style="display:none;">Select up to <strong>3</strong> proposals to use as reference for your draft.</div>
      <div id="results-list"></div>
      <button id="draft-btn" style="display:none;" disabled>Draft Proposal from Selected</button>
    </div>

    <div class="draft-section" id="draft-section" style="display:none;">
      <h2>Drafted Proposal</h2>
      <div class="draft-output" id="draft-output"></div>
    </div>

    <div class="empty-state" id="empty-state">
      <p>Enter a problem statement above and hit <strong>Find Similar</strong> to search the proposal corpus.</p>
    </div>
  </main>

  <script src="proposals.js"></script>
  <script type="module">
    import { pipeline } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3';

    // ── State ────────────────────────────────────────────────────────
    let embedder = null;
    const corpus = [];  // { proposal, embedding, sentences: [{ text, embedding }] }
    let currentResults = [];  // last search results
    let selected = new Set(); // selected proposal IDs (max 3)
    let uploadedFiles = [];   // { name, content }

    // ── DOM refs ─────────────────────────────────────────────────────
    const btnSearch     = document.getElementById('search-btn');
    const elStatus      = document.getElementById('model-status');
    const elStatusText  = document.getElementById('status-text');
    const elProgressBar = document.getElementById('progress-bar');
    const elProgressFill= document.getElementById('progress-fill');
    const elResults     = document.getElementById('results-section');
    const elResultsList = document.getElementById('results-list');
    const elResultsCount= document.getElementById('results-count');
    const elEmpty       = document.getElementById('empty-state');
    const elDraftBtn    = document.getElementById('draft-btn');
    const elDraftSection= document.getElementById('draft-section');
    const elDraftOutput = document.getElementById('draft-output');
    const elSelectionHint = document.getElementById('selection-hint');
    const elFileInput   = document.getElementById('file-input');
    const elFileChips   = document.getElementById('file-chips');

    btnSearch.disabled = true;

    // ── File upload handling ─────────────────────────────────────────
    elFileInput.addEventListener('change', async () => {
      const files = Array.from(elFileInput.files);
      for (const file of files) {
        const text = await file.text();
        uploadedFiles.push({ name: file.name, content: text });
      }
      elFileInput.value = '';
      renderFileChips();
    });

    function renderFileChips() {
      elFileChips.innerHTML = uploadedFiles.map((f, i) =>
        `<span class="file-chip">${esc(f.name)}<button data-idx="${i}">&times;</button></span>`
      ).join('');
      elFileChips.querySelectorAll('button').forEach(btn => {
        btn.addEventListener('click', e => {
          e.stopPropagation();
          uploadedFiles.splice(parseInt(btn.dataset.idx), 1);
          renderFileChips();
        });
      });
    }

    // ── Cosine similarity ───────────────────────────────────────────
    function cosineSim(a, b) {
      let dot = 0, nA = 0, nB = 0;
      for (let i = 0; i < a.length; i++) {
        dot += a[i] * b[i];
        nA  += a[i] * a[i];
        nB  += b[i] * b[i];
      }
      return dot / (Math.sqrt(nA) * Math.sqrt(nB));
    }

    // ── Split content into sentences ────────────────────────────────
    function splitSentences(text) {
      return text.split(/(?<=[.!?])\s+/).filter(s => s.length > 30);
    }

    // ── Embed one or more texts, return array of Float32Arrays ──────
    async function embedTexts(texts) {
      const out = await embedder(texts, { pooling: 'mean', normalize: true });
      const dim = out.dims[out.dims.length - 1];
      const results = [];
      for (let i = 0; i < texts.length; i++) {
        results.push(out.data.slice(i * dim, (i + 1) * dim));
      }
      return results;
    }

    // ── Initialise model & pre-compute embeddings ───────────────────
    async function init() {
      try {
        setStatus('Loading semantic model (~30 MB, cached after first load)…');
        embedder = await pipeline('feature-extraction', 'Xenova/all-MiniLM-L6-v2', {
          dtype: 'fp32'
        });

        elProgressBar.style.display = 'block';

        // Only embed full proposal content at startup (batch in groups of 10)
        const BATCH_SIZE = 10;
        for (let i = 0; i < PROPOSALS.length; i += BATCH_SIZE) {
          const batch = PROPOSALS.slice(i, i + BATCH_SIZE);
          const pct = Math.round(((i + batch.length) / PROPOSALS.length) * 100);
          setStatus(`Embedding proposals… ${Math.min(i + BATCH_SIZE, PROPOSALS.length)}/${PROPOSALS.length}`);
          elProgressFill.style.width = pct + '%';

          const embeddings = await embedTexts(batch.map(p => p.content));
          for (let j = 0; j < batch.length; j++) {
            corpus.push({
              proposal: batch[j],
              embedding: embeddings[j],
              sentences: null  // computed on-demand at search time for top results
            });
          }
        }

        elProgressBar.style.display = 'none';
        setStatus('Ready — semantic matching active', 'ready');
        btnSearch.disabled = false;
      } catch (err) {
        console.error(err);
        setStatus('Model failed to load: ' + err.message, 'error');
      }
    }

    function setStatus(msg, cls) {
      elStatusText.textContent = msg;
      elStatus.className = 'model-status' + (cls ? ' ' + cls : '');
    }

    // ── Embed sentences for an entry on demand ─────────────────────
    async function ensureSentenceEmbeddings(entry) {
      if (entry.sentences) return;
      const texts = splitSentences(entry.proposal.content);
      const embeddings = await embedTexts(texts);
      entry.sentences = texts.map((text, i) => ({ text, embedding: embeddings[i] }));
    }

    // ── Find best excerpt sentences with scores ────────────────────
    async function bestExcerpts(queryEmb, entry, count) {
      await ensureSentenceEmbeddings(entry);
      const ranked = entry.sentences
        .map(s => ({ text: s.text, sim: cosineSim(queryEmb, s.embedding) }))
        .sort((a, b) => b.sim - a.sim);
      return {
        texts: ranked.slice(0, count).map(s => s.text),
        reasons: ranked.slice(0, 3).map(s => ({
          text: s.text.length > 140 ? s.text.slice(0, 137) + '…' : s.text,
          sim: Math.round(s.sim * 100)
        }))
      };
    }

    // ── Score class ─────────────────────────────────────────────────
    function scoreClass(s) {
      if (s >= 55) return 'score-high';
      if (s >= 35) return 'score-medium';
      return 'score-low';
    }

    // ── Main search ─────────────────────────────────────────────────
    async function search() {
      const problem = document.getElementById('problem').value.trim();
      const supplemental = document.getElementById('supplemental').value.trim();
      if (!problem && !supplemental && uploadedFiles.length === 0) return;

      // combine typed supplemental + uploaded file contents
      const fileParts = uploadedFiles.map(f => f.content).join('\n');
      const queryText = [problem, supplemental, fileParts].filter(Boolean).join('\n');

      // show searching state
      elEmpty.style.display = 'none';
      elResults.style.display = 'block';
      elResultsCount.textContent = '';
      elSelectionHint.style.display = 'none';
      elDraftBtn.style.display = 'none';
      elResultsList.innerHTML = '<div class="searching-msg"><div class="loading-dots"><span></span><span></span><span></span><span></span></div>Finding similar proposals\u2026</div>';
      btnSearch.disabled = true;

      // Force browser repaint before heavy async work
      await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

      // embed query
      const [queryEmb] = await embedTexts([queryText]);

      // score each proposal by cosine similarity (fast — uses pre-computed embeddings)
      const scored = corpus
        .map(entry => ({
          entry,
          sim: cosineSim(queryEmb, entry.embedding),
          score: Math.max(0, Math.round(cosineSim(queryEmb, entry.embedding) * 100))
        }))
        .filter(r => r.score > 10)
        .sort((a, b) => b.score - a.score)
        .slice(0, 10);

      // Only embed sentences for top results (on-demand, much faster)
      const results = [];
      for (const { entry, score } of scored) {
        const { texts: excerpts, reasons } = await bestExcerpts(queryEmb, entry, 2);
        results.push({ ...entry.proposal, score, excerpts, reasons });
      }

      currentResults = results;
      selected = new Set();

      // auto-select results scoring above 70 (max 3)
      results.filter(r => r.score > 70).slice(0, 3).forEach(r => selected.add(r.id));

      render(results);
      btnSearch.disabled = false;
    }

    // ── Toggle selection ─────────────────────────────────────────────
    function toggleSelect(id) {
      if (selected.has(id)) {
        selected.delete(id);
      } else {
        if (selected.size >= 3) return; // max 3
        selected.add(id);
      }
      render(currentResults);
    }

    // ── Render results ──────────────────────────────────────────────
    function render(results) {
      elEmpty.style.display = 'none';
      elResults.style.display = 'block';
      elDraftSection.style.display = 'none';

      if (results.length === 0) {
        elResultsCount.textContent = '';
        elSelectionHint.style.display = 'none';
        elDraftBtn.style.display = 'none';
        elResultsList.innerHTML = '<div class="no-results">No similar proposals found. Try a different description.</div>';
        return;
      }

      elResultsCount.textContent = `${results.length} match${results.length === 1 ? '' : 'es'}`;
      elSelectionHint.style.display = 'block';
      elDraftBtn.style.display = 'block';
      elDraftBtn.disabled = selected.size === 0;
      elDraftBtn.textContent = selected.size > 0
        ? `Draft Proposal from ${selected.size} Selected`
        : 'Draft Proposal from Selected';

      const checkSvg = `<svg viewBox="0 0 14 14" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="2.5 7.5 5.5 10.5 11.5 4"/></svg>`;

      elResultsList.innerHTML = results.map(r => {
        const sel = selected.has(r.id);
        const whyHtml = (r.reasons || []).map(reason =>
          `<div class="score-why-item"><span class="score-why-sim">${reason.sim}</span><span>${esc(reason.text)}</span></div>`
        ).join('');
        return `
        <div class="result-card${sel ? ' selected' : ''}" data-id="${esc(r.id)}">
          <div class="select-check">${checkSvg}</div>
          <div class="result-top">
            <div>
              <div class="result-title">${esc(r.title)}</div>
              <div class="result-source">${esc(r.source)}</div>
            </div>
            <div class="score-badge ${scoreClass(r.score)}">${r.score}</div>
          </div>
          ${r.excerpts.length ? `<div class="result-excerpt">${r.excerpts.map(e => esc(e)).join(' … ')}</div>` : ''}
          ${whyHtml ? `<div class="score-why"><div class="score-why-header">Why it matched</div>${whyHtml}</div>` : ''}
        </div>`;
      }).join('');

      // bind click handlers
      elResultsList.querySelectorAll('.result-card').forEach(card => {
        card.addEventListener('click', () => toggleSelect(card.dataset.id));
      });
    }

    // ── Draft proposal from selections ──────────────────────────────
    function draftProposal() {
      const problem = document.getElementById('problem').value.trim();
      const supplemental = document.getElementById('supplemental').value.trim();
      const fileContext = uploadedFiles.map(f => f.content).join('\n');
      const selectedProposals = currentResults.filter(r => selected.has(r.id));

      if (selectedProposals.length === 0) return;

      // Helper: extract sentences matching a pattern from selected proposals
      function gatherSentences(pattern, max) {
        const results = [];
        for (const sp of selectedProposals) {
          const sentences = (sp.content || '').split(/(?<=[.!?])\s+/).filter(s => s.length > 30);
          const matches = sentences.filter(s => pattern.test(s));
          results.push(...matches.slice(0, max));
        }
        return results;
      }

      let html = '';

      // ── PURPOSE ──
      html += `<h3>Purpose</h3>`;
      html += `<p>This document outlines Slalom's proposed approach, team structure, and engagement model to the client need described below.</p>`;

      // ── OUR UNDERSTANDING ──
      html += `<h3>Our Understanding</h3>`;
      // Build a concise summary: restate the problem + high-level solution direction from top proposals
      const understandingSentences = [];
      // Start with 1-2 sentences restating the core problem
      const problemSentences = problem.split(/(?<=[.!?])\s+/).filter(s => s.length > 20);
      if (problemSentences.length > 0) {
        understandingSentences.push(problemSentences[0]);
        if (problemSentences.length > 1) understandingSentences.push(problemSentences[1]);
      }
      // Add 1-2 high-level challenge/context sentences from the best-matching proposals
      const challenges = gatherSentences(
        /\b(challenge|problem|issue|gap|risk|struggle|pain|lack|limit|fragment|siloed|decline|unable|cannot)\b/i, 3
      );
      if (challenges.length > 0) understandingSentences.push(challenges[0]);
      // Add 1 sentence describing the high-level solution direction
      const solutionHints = gatherSentences(
        /\b(propos|recommend|approach|deliver|solution|enable|platform|system|tool)\b/i, 2
      );
      if (solutionHints.length > 0) understandingSentences.push(solutionHints[0]);
      // Cap at 5 sentences
      const summary = understandingSentences.slice(0, 5).join(' ');
      html += `<p>${esc(summary)}</p>`;

      // ── SLALOM PROPOSED DELIVERY APPROACH ──
      html += `<h3>Slalom Proposed Delivery Approach</h3>`;
      html += `<p>From our experience in similar engagements, we have found the fastest way to drive value is to ramp quickly and continually refine our engagement model through joint delivery. Slalom proposes the following approach:</p>`;
      const approachSentences = gatherSentences(
        /\b(propos|approach|recommend|deliver|phase|build|implement|establish|develop|design|iterati|agile|sprint)\b/i, 4
      );
      if (approachSentences.length) {
        html += `<ul>`;
        for (const a of approachSentences) html += `<li>${esc(a)}</li>`;
        html += `</ul>`;
      } else {
        html += `<p><em>[To be defined based on scoping conversations]</em></p>`;
      }

      // ── SLALOM ROLES & RESPONSIBILITIES ──
      html += `<h3>Slalom Roles &amp; Responsibilities</h3>`;
      const roleSentences = gatherSentences(
        /\b(responsible|role|lead|manager|engineer|architect|designer|analyst|consultant|SME|executive)\b/i, 5
      );
      if (roleSentences.length) {
        html += `<table style="width:100%;border-collapse:collapse;font-size:14px;margin-top:8px;">`;
        html += `<thead><tr style="border-bottom:2px solid #e8eaed;text-align:left;"><th style="padding:8px 12px;">Role</th><th style="padding:8px 12px;">Responsibility</th></tr></thead><tbody>`;
        for (const rs of roleSentences) {
          // Try to extract a role name from the sentence
          const roleMatch = rs.match(/\b((?:Engagement|Program|Engineering|Product|Technical|Principal|Quality|UX|Data|Software|Delivery|Accountable)\s*(?:Lead|Manager|Engineer|Architect|Designer|Executive|SME)?)\b/i);
          const roleName = roleMatch ? roleMatch[1] : 'TBD';
          html += `<tr style="border-bottom:1px solid #f3f4f6;"><td style="padding:8px 12px;font-weight:600;white-space:nowrap;vertical-align:top;">${esc(roleName)}</td><td style="padding:8px 12px;">${esc(rs)}</td></tr>`;
        }
        html += `</tbody></table>`;
      } else {
        html += `<p><em>[Roles to be determined based on engagement scope]</em></p>`;
      }

      // ── TIMELINE ──
      html += `<h3>Timeline</h3>`;
      const timelineSentences = gatherSentences(
        /\b(week|month|phase|timeline|duration|sprint|quarter|kickoff|onboard|ramp|milestone)\b/i, 3
      );
      if (timelineSentences.length) {
        html += `<ul>`;
        for (const t of timelineSentences) html += `<li>${esc(t)}</li>`;
        html += `</ul>`;
      } else {
        html += `<p><em>[Timeline to be determined during scoping]</em></p>`;
      }

      // ── TOTAL ESTIMATED COST ──
      html += `<h3>Total Estimated Cost</h3>`;
      html += `<p>This engagement is structured as a fixed-capacity model. Total cost will be determined based on finalized team structure and duration.</p>`;
      html += `<p><em>[Cost estimate to be developed once scope and team are confirmed]</em></p>`;

      // ── ASSUMPTIONS ──
      html += `<h3>Assumptions</h3>`;
      html += `<ul>`;
      html += `<li>Client stakeholders and business users will be available for interviews and feedback cycles and will respond to Slalom requests for information in a timely manner (within 1-2 business days).</li>`;
      html += `<li>Client will review Deliverables and respond with comments or acceptance in an agreed-upon timeframe.</li>`;
      html += `<li>Client will provide access to, and all necessary permissions to use agreed upon project tooling.</li>`;
      html += `<li>The timeline for this project assumes use of existing internally approved tools and access to information necessary to complete the deliverables.</li>`;
      // Add domain-specific assumptions from reference proposals
      const assumptionSentences = gatherSentences(
        /\b(assum|provid|access|responsible|dependent|require|timely|necessary|approval)\b/i, 3
      );
      for (const a of assumptionSentences) {
        html += `<li>${esc(a)}</li>`;
      }
      html += `</ul>`;

      // ── NEXT STEPS ──
      html += `<h3>Next Steps</h3>`;
      html += `<ol>`;
      html += `<li>Incorporate client feedback on this proposal.</li>`;
      html += `<li>Conduct final review of proposal with client sponsors and stakeholders.</li>`;
      html += `<li>Upon alignment, Slalom will generate a formal Work Order.</li>`;
      html += `<li>Client will initiate Legal, Tax and Finance approval processes. (Typically, a two-week process)</li>`;
      html += `<li>Slalom to identify the team and begin the onboarding process. (Typically, a two-week process)</li>`;
      html += `<li>Upon approval of Work Order, conduct project kickoff and commence engagement.</li>`;
      html += `</ol>`;

      // ── Reference ──
      html += `<h3 style="margin-top:32px;font-size:12px;color:#9ca3af;">Reference Proposals Used</h3><div>`;
      for (const sp of selectedProposals) {
        html += `<span class="ref-tag">${esc(sp.title)} (score: ${sp.score})</span>`;
      }
      html += `</div>`;

      elDraftOutput.innerHTML = html;
      elDraftSection.style.display = 'block';
      elDraftSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    // ── Escape HTML ─────────────────────────────────────────────────
    function esc(str) {
      const el = document.createElement('span');
      el.textContent = str;
      return el.innerHTML;
    }

    // ── Wire up ─────────────────────────────────────────────────────
    btnSearch.addEventListener('click', search);
    elDraftBtn.addEventListener('click', draftProposal);

    document.querySelectorAll('textarea').forEach(ta => {
      ta.addEventListener('keydown', e => {
        if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
          e.preventDefault();
          search();
        }
      });
    });

    // ── Boot ─────────────────────────────────────────────────────────
    init();
  </script>
</body>
</html>
