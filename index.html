<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bench Press — Proposal Similarity Matcher</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f8f9fb;
      color: #1a1a2e;
      line-height: 1.6;
      min-height: 100vh;
    }

    header {
      background: #fff;
      border-bottom: 1px solid #e8eaed;
      padding: 20px 0;
    }

    header .inner {
      max-width: 860px;
      margin: 0 auto;
      padding: 0 24px;
    }

    header h1 {
      font-size: 22px;
      font-weight: 700;
      color: #1a1a2e;
      letter-spacing: -0.3px;
    }

    header h1 span {
      color: #5e6ad2;
    }

    header p {
      font-size: 14px;
      color: #6b7280;
      margin-top: 2px;
    }

    main {
      max-width: 860px;
      margin: 0 auto;
      padding: 32px 24px;
    }

    /* Input section */
    .input-section {
      background: #fff;
      border: 1px solid #e8eaed;
      border-radius: 12px;
      padding: 28px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #374151;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    label .hint {
      font-weight: 400;
      text-transform: none;
      letter-spacing: 0;
      color: #9ca3af;
      margin-left: 4px;
    }

    textarea {
      width: 100%;
      border: 1.5px solid #e5e7eb;
      border-radius: 8px;
      padding: 12px 14px;
      font-family: inherit;
      font-size: 15px;
      color: #1a1a2e;
      background: #fafbfc;
      resize: vertical;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    textarea:focus {
      outline: none;
      border-color: #5e6ad2;
      box-shadow: 0 0 0 3px rgba(94, 106, 210, 0.1);
      background: #fff;
    }

    textarea::placeholder { color: #c4c9d4; }

    .field + .field { margin-top: 20px; }

    button#search-btn {
      margin-top: 24px;
      width: 100%;
      padding: 13px 24px;
      background: #5e6ad2;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    button#search-btn:hover { background: #4f5bc0; }
    button#search-btn:active { background: #4550b0; }

    button#search-btn:disabled {
      background: #c4c9d4;
      cursor: not-allowed;
    }

    /* Results */
    .results-section {
      margin-top: 32px;
    }

    .results-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .results-header h2 {
      font-size: 16px;
      font-weight: 600;
      color: #374151;
    }

    .results-header .count {
      font-size: 13px;
      color: #9ca3af;
    }

    .keywords-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 16px;
    }

    .keyword-tag {
      font-size: 12px;
      padding: 3px 10px;
      background: #eef0fb;
      color: #5e6ad2;
      border-radius: 100px;
      font-weight: 500;
    }

    .result-card {
      background: #fff;
      border: 1px solid #e8eaed;
      border-radius: 10px;
      padding: 22px 24px;
      margin-bottom: 12px;
      transition: box-shadow 0.15s;
    }

    .result-card:hover {
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }

    .result-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
    }

    .result-title {
      font-size: 16px;
      font-weight: 600;
      color: #1a1a2e;
    }

    .result-source {
      font-size: 12px;
      color: #9ca3af;
      margin-top: 2px;
    }

    .score-badge {
      flex-shrink: 0;
      min-width: 52px;
      text-align: center;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 18px;
      font-weight: 700;
    }

    .score-high   { background: #ecfdf5; color: #059669; }
    .score-medium { background: #fef9ee; color: #d97706; }
    .score-low    { background: #fef2f2; color: #dc2626; }

    .result-excerpt {
      margin-top: 14px;
      font-size: 14px;
      color: #4b5563;
      line-height: 1.7;
      border-left: 3px solid #e8eaed;
      padding-left: 14px;
    }

    .result-excerpt mark {
      background: #fef08a;
      color: inherit;
      border-radius: 2px;
      padding: 0 2px;
    }

    /* Empty / no results */
    .empty-state {
      text-align: center;
      padding: 48px 24px;
      color: #9ca3af;
    }

    .empty-state .icon {
      font-size: 40px;
      margin-bottom: 12px;
    }

    .empty-state p {
      font-size: 15px;
    }

    .no-results {
      text-align: center;
      padding: 40px 24px;
      color: #9ca3af;
      font-size: 15px;
    }
  </style>
</head>
<body>
  <header>
    <div class="inner">
      <h1><span>Bench Press</span> — Proposal Matcher</h1>
      <p>Find similar past proposals by describing the client's problem.</p>
    </div>
  </header>

  <main>
    <div class="input-section">
      <div class="field">
        <label for="problem">Problem Statement</label>
        <textarea id="problem" rows="4" placeholder="Describe the client's core challenge or ask…"></textarea>
      </div>
      <div class="field">
        <label for="supplemental">Supplemental Info <span class="hint">— industry, constraints, technologies, timeline, etc.</span></label>
        <textarea id="supplemental" rows="3" placeholder="Any additional context that might help find similar work…"></textarea>
      </div>
      <button id="search-btn">Find Similar Proposals</button>
    </div>

    <div class="results-section" id="results-section" style="display:none;">
      <div class="results-header">
        <h2>Results</h2>
        <span class="count" id="results-count"></span>
      </div>
      <div class="keywords-bar" id="keywords-bar"></div>
      <div id="results-list"></div>
    </div>

    <div class="empty-state" id="empty-state">
      <div class="icon">🏋️</div>
      <p>Enter a problem statement above and hit <strong>Find Similar</strong> to search the proposal corpus.</p>
    </div>
  </main>

  <script src="proposals.js"></script>
  <script>
    // ── Stop-words list ──────────────────────────────────────────────
    const STOP_WORDS = new Set([
      "a","an","the","and","or","but","is","are","was","were","be","been",
      "being","have","has","had","do","does","did","will","would","shall",
      "should","may","might","must","can","could","of","in","to","for",
      "with","on","at","from","by","about","as","into","through","during",
      "before","after","above","below","between","out","off","over","under",
      "again","further","then","once","here","there","when","where","why",
      "how","all","each","every","both","few","more","most","other","some",
      "such","no","nor","not","only","own","same","so","than","too","very",
      "just","because","if","while","that","this","these","those","it","its",
      "we","our","they","their","them","he","she","his","her","you","your",
      "i","me","my","up","also","which","what","who","whom","need","needs",
      "want","wants","looking","including","include","across","along","well",
      "new","also","using","used","use","based","like","get","make","take"
    ]);

    // ── Tokeniser ────────────────────────────────────────────────────
    function tokenize(text) {
      return text
        .toLowerCase()
        .replace(/[^a-z0-9\s-]/g, " ")
        .split(/\s+/)
        .filter(w => w.length > 2 && !STOP_WORDS.has(w));
    }

    // ── TF (term frequency) ─────────────────────────────────────────
    function termFrequency(tokens) {
      const tf = {};
      for (const t of tokens) {
        tf[t] = (tf[t] || 0) + 1;
      }
      // normalise by max frequency
      const max = Math.max(...Object.values(tf), 1);
      for (const t in tf) tf[t] /= max;
      return tf;
    }

    // ── IDF across corpus ───────────────────────────────────────────
    function buildIDF(corpus) {
      const df = {};
      const N = corpus.length;
      for (const doc of corpus) {
        const seen = new Set(tokenize(doc));
        for (const t of seen) {
          df[t] = (df[t] || 0) + 1;
        }
      }
      const idf = {};
      for (const t in df) {
        idf[t] = Math.log((N + 1) / (df[t] + 1)) + 1; // smoothed IDF
      }
      return idf;
    }

    // ── Similarity score between query and a document ───────────────
    function score(queryTokens, docContent, idf) {
      const docTokens = tokenize(docContent);
      const docTF = termFrequency(docTokens);
      const docSet = new Set(docTokens);

      let total = 0;
      let maxPossible = 0;
      const matched = [];

      for (const qt of new Set(queryTokens)) {
        const weight = idf[qt] || 1;
        maxPossible += weight;
        if (docSet.has(qt)) {
          total += weight * (docTF[qt] || 0);
          matched.push(qt);
        }
      }

      const raw = maxPossible > 0 ? (total / maxPossible) * 100 : 0;
      return { score: Math.round(raw), matched };
    }

    // ── Extract best excerpt with matched terms ─────────────────────
    function extractExcerpt(content, matchedTerms, windowSize) {
      if (matchedTerms.length === 0) return "";
      const sentences = content.split(/(?<=[.!?])\s+/);
      const matchSet = new Set(matchedTerms);
      let best = "";
      let bestCount = 0;

      for (let i = 0; i < sentences.length; i++) {
        const chunk = sentences.slice(i, i + windowSize).join(" ");
        const words = tokenize(chunk);
        const count = words.filter(w => matchSet.has(w)).length;
        if (count > bestCount) {
          bestCount = count;
          best = chunk;
        }
      }

      return best;
    }

    function highlightExcerpt(excerpt, matchedTerms) {
      const matchSet = new Set(matchedTerms);
      return excerpt.replace(/\b([a-zA-Z0-9-]+)\b/g, (word) => {
        return matchSet.has(word.toLowerCase()) ? `<mark>${word}</mark>` : word;
      });
    }

    // ── Score class ─────────────────────────────────────────────────
    function scoreClass(s) {
      if (s >= 50) return "score-high";
      if (s >= 25) return "score-medium";
      return "score-low";
    }

    // ── Main search ─────────────────────────────────────────────────
    function search() {
      const problem = document.getElementById("problem").value.trim();
      const supplemental = document.getElementById("supplemental").value.trim();

      if (!problem && !supplemental) return;

      const queryText = problem + " " + supplemental;
      const queryTokens = tokenize(queryText);

      if (queryTokens.length === 0) return;

      // build IDF from corpus + query
      const corpusDocs = PROPOSALS.map(p => p.content);
      corpusDocs.push(queryText);
      const idf = buildIDF(corpusDocs);

      // score each proposal
      const results = PROPOSALS.map(p => {
        const { score: s, matched } = score(queryTokens, p.content, idf);
        const excerpt = extractExcerpt(p.content, matched, 2);
        return { ...p, score: s, matched, excerpt };
      })
        .filter(r => r.score > 0)
        .sort((a, b) => b.score - a.score);

      render(queryTokens, results);
    }

    // ── Render results ──────────────────────────────────────────────
    function render(queryTokens, results) {
      const section = document.getElementById("results-section");
      const list = document.getElementById("results-list");
      const count = document.getElementById("results-count");
      const kwBar = document.getElementById("keywords-bar");
      const empty = document.getElementById("empty-state");

      empty.style.display = "none";
      section.style.display = "block";

      // show extracted keywords
      const uniqueKeywords = [...new Set(queryTokens)].slice(0, 20);
      kwBar.innerHTML = uniqueKeywords
        .map(k => `<span class="keyword-tag">${k}</span>`)
        .join("");

      if (results.length === 0) {
        count.textContent = "";
        list.innerHTML = `<div class="no-results">No matching proposals found. Try broadening your description.</div>`;
        return;
      }

      count.textContent = `${results.length} match${results.length === 1 ? "" : "es"}`;

      list.innerHTML = results.map(r => `
        <div class="result-card">
          <div class="result-top">
            <div>
              <div class="result-title">${esc(r.title)}</div>
              <div class="result-source">${esc(r.source)}</div>
            </div>
            <div class="score-badge ${scoreClass(r.score)}">${r.score}</div>
          </div>
          ${r.excerpt ? `<div class="result-excerpt">${highlightExcerpt(esc(r.excerpt), r.matched)}</div>` : ""}
        </div>
      `).join("");
    }

    // ── Escape HTML ─────────────────────────────────────────────────
    function esc(str) {
      const el = document.createElement("span");
      el.textContent = str;
      return el.innerHTML;
    }

    // ── Wire up ─────────────────────────────────────────────────────
    document.getElementById("search-btn").addEventListener("click", search);

    // allow Ctrl+Enter from either textarea
    document.querySelectorAll("textarea").forEach(ta => {
      ta.addEventListener("keydown", e => {
        if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) {
          e.preventDefault();
          search();
        }
      });
    });
  </script>
</body>
</html>
