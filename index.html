<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bench Press — Proposal Similarity Matcher</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f8f9fb;
      color: #1a1a2e;
      line-height: 1.6;
      min-height: 100vh;
    }

    header {
      background: #fff;
      border-bottom: 1px solid #e8eaed;
      padding: 20px 0;
    }

    header .inner {
      max-width: 860px;
      margin: 0 auto;
      padding: 0 24px;
    }

    header h1 {
      font-size: 22px;
      font-weight: 700;
      color: #1a1a2e;
      letter-spacing: -0.3px;
    }

    header h1 span {
      color: #5e6ad2;
    }

    header p {
      font-size: 14px;
      color: #6b7280;
      margin-top: 2px;
    }

    main {
      max-width: 860px;
      margin: 0 auto;
      padding: 32px 24px;
    }

    /* Input section */
    .input-section {
      background: #fff;
      border: 1px solid #e8eaed;
      border-radius: 12px;
      padding: 28px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #374151;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    label .hint {
      font-weight: 400;
      text-transform: none;
      letter-spacing: 0;
      color: #9ca3af;
      margin-left: 4px;
    }

    textarea {
      width: 100%;
      border: 1.5px solid #e5e7eb;
      border-radius: 8px;
      padding: 12px 14px;
      font-family: inherit;
      font-size: 15px;
      color: #1a1a2e;
      background: #fafbfc;
      resize: vertical;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    textarea:focus {
      outline: none;
      border-color: #5e6ad2;
      box-shadow: 0 0 0 3px rgba(94, 106, 210, 0.1);
      background: #fff;
    }

    textarea::placeholder { color: #c4c9d4; }

    .field + .field { margin-top: 20px; }

    button#search-btn {
      margin-top: 24px;
      width: 100%;
      padding: 13px 24px;
      background: #5e6ad2;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    button#search-btn:hover { background: #4f5bc0; }
    button#search-btn:active { background: #4550b0; }

    button#search-btn:disabled {
      background: #c4c9d4;
      cursor: not-allowed;
    }

    /* Results */
    .results-section {
      margin-top: 32px;
    }

    .results-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .results-header h2 {
      font-size: 16px;
      font-weight: 600;
      color: #374151;
    }

    .results-header .count {
      font-size: 13px;
      color: #9ca3af;
    }

    .keywords-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 16px;
    }

    .keyword-tag {
      font-size: 12px;
      padding: 3px 10px;
      background: #eef0fb;
      color: #5e6ad2;
      border-radius: 100px;
      font-weight: 500;
    }

    .result-card {
      background: #fff;
      border: 1px solid #e8eaed;
      border-radius: 10px;
      padding: 22px 24px;
      margin-bottom: 12px;
      transition: box-shadow 0.15s;
    }

    .result-card:hover {
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }

    .result-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
    }

    .result-title {
      font-size: 16px;
      font-weight: 600;
      color: #1a1a2e;
    }

    .result-source {
      font-size: 12px;
      color: #9ca3af;
      margin-top: 2px;
    }

    .score-badge {
      flex-shrink: 0;
      min-width: 52px;
      text-align: center;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 18px;
      font-weight: 700;
    }

    .score-high   { background: #ecfdf5; color: #059669; }
    .score-medium { background: #fef9ee; color: #d97706; }
    .score-low    { background: #fef2f2; color: #dc2626; }

    .result-excerpt {
      margin-top: 14px;
      font-size: 14px;
      color: #4b5563;
      line-height: 1.7;
      border-left: 3px solid #e8eaed;
      padding-left: 14px;
    }

    .result-excerpt mark {
      background: #fef08a;
      color: inherit;
      border-radius: 2px;
      padding: 0 2px;
    }

    /* Empty / no results */
    .empty-state {
      text-align: center;
      padding: 48px 24px;
      color: #9ca3af;
    }

    .empty-state .icon {
      font-size: 40px;
      margin-bottom: 12px;
    }

    .empty-state p {
      font-size: 15px;
    }

    .no-results {
      text-align: center;
      padding: 40px 24px;
      color: #9ca3af;
      font-size: 15px;
    }

    /* Model status */
    .model-status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      font-size: 13px;
      color: #9ca3af;
    }

    .model-status.ready { color: #059669; }
    .model-status.error { color: #dc2626; }

    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid #e5e7eb;
      border-top-color: #5e6ad2;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    .model-status.ready .spinner,
    .model-status.error .spinner { display: none; }

    @keyframes spin { to { transform: rotate(360deg); } }

    .progress-bar {
      width: 200px;
      height: 4px;
      background: #e5e7eb;
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-bar .fill {
      height: 100%;
      background: #5e6ad2;
      border-radius: 2px;
      transition: width 0.3s;
    }

    .searching-msg {
      text-align: center;
      padding: 40px 24px;
      color: #6b7280;
      font-size: 15px;
    }

    .searching-msg .spinner {
      width: 20px;
      height: 20px;
      margin: 0 auto 12px;
    }
  </style>
</head>
<body>
  <header>
    <div class="inner">
      <h1><span>Bench Press</span> — Proposal Matcher</h1>
      <p>Find similar past proposals by describing the client's problem.</p>
      <div class="model-status" id="model-status">
        <div class="spinner"></div>
        <span id="status-text">Initializing…</span>
        <div class="progress-bar" id="progress-bar" style="display:none"><div class="fill" id="progress-fill"></div></div>
      </div>
    </div>
  </header>

  <main>
    <div class="input-section">
      <div class="field">
        <label for="problem">Problem Statement</label>
        <textarea id="problem" rows="4" placeholder="Describe the client's core challenge or ask…"></textarea>
      </div>
      <div class="field">
        <label for="supplemental">Supplemental Info <span class="hint">— industry, constraints, technologies, timeline, etc.</span></label>
        <textarea id="supplemental" rows="3" placeholder="Any additional context that might help find similar work…"></textarea>
      </div>
      <button id="search-btn">Find Similar Proposals</button>
    </div>

    <div class="results-section" id="results-section" style="display:none;">
      <div class="results-header">
        <h2>Results</h2>
        <span class="count" id="results-count"></span>
      </div>
      <div id="results-list"></div>
    </div>

    <div class="empty-state" id="empty-state">
      <div class="icon">🏋️</div>
      <p>Enter a problem statement above and hit <strong>Find Similar</strong> to search the proposal corpus.</p>
    </div>
  </main>

  <script src="proposals.js"></script>
  <script type="module">
    import { pipeline } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3';

    // ── State ────────────────────────────────────────────────────────
    let embedder = null;
    const corpus = [];  // { proposal, embedding, sentences: [{ text, embedding }] }

    // ── DOM refs ─────────────────────────────────────────────────────
    const btnSearch     = document.getElementById('search-btn');
    const elStatus      = document.getElementById('model-status');
    const elStatusText  = document.getElementById('status-text');
    const elProgressBar = document.getElementById('progress-bar');
    const elProgressFill= document.getElementById('progress-fill');
    const elResults     = document.getElementById('results-section');
    const elResultsList = document.getElementById('results-list');
    const elResultsCount= document.getElementById('results-count');
    const elEmpty       = document.getElementById('empty-state');

    btnSearch.disabled = true;

    // ── Cosine similarity ───────────────────────────────────────────
    function cosineSim(a, b) {
      let dot = 0, nA = 0, nB = 0;
      for (let i = 0; i < a.length; i++) {
        dot += a[i] * b[i];
        nA  += a[i] * a[i];
        nB  += b[i] * b[i];
      }
      return dot / (Math.sqrt(nA) * Math.sqrt(nB));
    }

    // ── Split content into sentences ────────────────────────────────
    function splitSentences(text) {
      return text.split(/(?<=[.!?])\s+/).filter(s => s.length > 30);
    }

    // ── Embed one or more texts, return array of Float32Arrays ──────
    async function embedTexts(texts) {
      const out = await embedder(texts, { pooling: 'mean', normalize: true });
      const dim = out.dims[out.dims.length - 1];
      const results = [];
      for (let i = 0; i < texts.length; i++) {
        results.push(out.data.slice(i * dim, (i + 1) * dim));
      }
      return results;
    }

    // ── Initialise model & pre-compute embeddings ───────────────────
    async function init() {
      try {
        setStatus('Loading semantic model (~30 MB, cached after first load)…');
        embedder = await pipeline('feature-extraction', 'Xenova/all-MiniLM-L6-v2', {
          dtype: 'fp32'
        });

        elProgressBar.style.display = 'block';

        for (let i = 0; i < PROPOSALS.length; i++) {
          const p = PROPOSALS[i];
          const pct = Math.round(((i + 1) / PROPOSALS.length) * 100);
          setStatus(`Embedding proposals… ${i + 1}/${PROPOSALS.length}`);
          elProgressFill.style.width = pct + '%';

          // batch: full content + individual sentences in one call
          const sentences = splitSentences(p.content);
          const textsToEmbed = [p.content, ...sentences];
          const embeddings = await embedTexts(textsToEmbed);

          corpus.push({
            proposal: p,
            embedding: embeddings[0],
            sentences: sentences.map((text, j) => ({ text, embedding: embeddings[j + 1] }))
          });
        }

        elProgressBar.style.display = 'none';
        setStatus('Ready — semantic matching active', 'ready');
        btnSearch.disabled = false;
      } catch (err) {
        console.error(err);
        setStatus('Model failed to load: ' + err.message, 'error');
      }
    }

    function setStatus(msg, cls) {
      elStatusText.textContent = msg;
      elStatus.className = 'model-status' + (cls ? ' ' + cls : '');
    }

    // ── Find best excerpt sentences ─────────────────────────────────
    function bestExcerpts(queryEmb, entry, count) {
      return entry.sentences
        .map(s => ({ text: s.text, sim: cosineSim(queryEmb, s.embedding) }))
        .sort((a, b) => b.sim - a.sim)
        .slice(0, count)
        .map(s => s.text);
    }

    // ── Score class ─────────────────────────────────────────────────
    function scoreClass(s) {
      if (s >= 55) return 'score-high';
      if (s >= 35) return 'score-medium';
      return 'score-low';
    }

    // ── Main search ─────────────────────────────────────────────────
    async function search() {
      const problem = document.getElementById('problem').value.trim();
      const supplemental = document.getElementById('supplemental').value.trim();
      if (!problem && !supplemental) return;

      const queryText = problem + (supplemental ? '\n' + supplemental : '');

      // show searching state
      elEmpty.style.display = 'none';
      elResults.style.display = 'block';
      elResultsCount.textContent = '';
      elResultsList.innerHTML = '<div class="searching-msg"><div class="spinner"></div>Finding similar proposals…</div>';
      btnSearch.disabled = true;

      // embed query
      const [queryEmb] = await embedTexts([queryText]);

      // score each proposal by cosine similarity
      const results = corpus
        .map(entry => {
          const sim = cosineSim(queryEmb, entry.embedding);
          const score = Math.max(0, Math.round(sim * 100));
          const excerpts = bestExcerpts(queryEmb, entry, 2);
          return { ...entry.proposal, score, excerpts };
        })
        .filter(r => r.score > 10)
        .sort((a, b) => b.score - a.score)
        .slice(0, 10);

      render(results);
      btnSearch.disabled = false;
    }

    // ── Render results ──────────────────────────────────────────────
    function render(results) {
      elEmpty.style.display = 'none';
      elResults.style.display = 'block';

      if (results.length === 0) {
        elResultsCount.textContent = '';
        elResultsList.innerHTML = '<div class="no-results">No similar proposals found. Try a different description.</div>';
        return;
      }

      elResultsCount.textContent = `${results.length} match${results.length === 1 ? '' : 'es'}`;

      elResultsList.innerHTML = results.map(r => `
        <div class="result-card">
          <div class="result-top">
            <div>
              <div class="result-title">${esc(r.title)}</div>
              <div class="result-source">${esc(r.source)}</div>
            </div>
            <div class="score-badge ${scoreClass(r.score)}">${r.score}</div>
          </div>
          ${r.excerpts.length ? `<div class="result-excerpt">${r.excerpts.map(e => esc(e)).join(' … ')}</div>` : ''}
        </div>
      `).join('');
    }

    // ── Escape HTML ─────────────────────────────────────────────────
    function esc(str) {
      const el = document.createElement('span');
      el.textContent = str;
      return el.innerHTML;
    }

    // ── Wire up ─────────────────────────────────────────────────────
    btnSearch.addEventListener('click', search);

    document.querySelectorAll('textarea').forEach(ta => {
      ta.addEventListener('keydown', e => {
        if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
          e.preventDefault();
          search();
        }
      });
    });

    // ── Boot ─────────────────────────────────────────────────────────
    init();
  </script>
</body>
</html>
